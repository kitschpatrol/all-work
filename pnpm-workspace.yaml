allowBuilds:
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lognow@0.8.7
  - metascope@0.13.8
  - '@kitschpatrol/electron-vite@6.0.0-fork.1'
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
  '@tanstack/svelte-table':
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
    - .claude/skills
