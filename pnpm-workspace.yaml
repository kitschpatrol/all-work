allowBuilds:
  electron-winstaller: true
  unrs-resolver: true
overrides:
  # Remove when Knip no longer reports SvelteKit's generated $app config as an npm dependency.
  # https://github.com/webpro-nl/knip/commit/8c5d329f5a139b94623776a4c061de9dc0ac1bcb
  '@kitschpatrol/knip-config@8.14.1>knip': 6.44.2
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
  '@tanstack/svelte-table':
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
    - .claude/skills
